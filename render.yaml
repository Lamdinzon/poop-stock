services:
  - type: web
    name: poop-stock-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --break-system-packages -r requirements.txt
    startCommand: python3 -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: FRONTEND_ORIGINS
        sync: false
